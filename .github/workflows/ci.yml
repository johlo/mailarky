name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  # Weekly, so new vulnerabilities and runner changes surface without a push.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: check
      - run: docker compose up -d --build --wait --wait-timeout 60
      - name: SMTP, HTTP, TLS IMAP and fault isolation smoke test
        run: python3 scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
