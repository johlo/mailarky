name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
      - run: docker compose up -d --build --wait --wait-timeout 60
      - name: SMTP, HTTP, TLS IMAP and fault isolation smoke test
        run: python3 scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
