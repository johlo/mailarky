name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: docker compose up -d --build --wait --wait-timeout 60
      - name: Seed a message through the running container
        run: |
          curl -fsS http://localhost:8026/messages \
            -H 'Content-Type: application/json' \
            -d '{"folder":"INBOX","from":"alice@example.test","to":["clinic@example.test"],"subject":"CI fixture"}'
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
