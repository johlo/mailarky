name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Use a tag such as v0.1.0 or v0.1.0-rc.1.' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Permit retrying an unfinished draft, but never replace a published release.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo 'This version is already published; create a new version tag.' >&2
              exit 1
            fi
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary archives and checksums
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: v2.18.2
          args: release --clean --skip=publish

      - name: Prepare certificate download and release notes
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          cp testdata/tls/server.crt dist/server.crt
          (cd dist && sha256sum server.crt >> checksums.txt)
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          image = os.environ['IMAGE']
          repository = os.environ['GITHUB_REPOSITORY']
          notes = f'''Docker image: `{image}:{tag}` (Linux AMD64 and ARM64).

          Binary archives are available for Linux, macOS (`darwin`), and Windows,
          for AMD64 and ARM64. Each archive includes the MIT license, documentation,
          and public TLS test fixtures. SHA-256 hashes are in `checksums.txt`.

          See the [quick start](https://github.com/{repository}/blob/{tag}/README.md#quick-start)
          and [standalone setup](https://github.com/{repository}/blob/{tag}/docs/how-to/run-and-test.md#run-without-docker).
          '''
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish Docker image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Verify both published image architectures
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          for architecture in amd64 arm64; do
            actual=$(docker run --rm --platform "linux/$architecture" "$IMAGE@$DIGEST" --version)
            test "$actual" = "mailarky $RELEASE_TAG ${REVISION:0:12}"
          done

      - name: Publish GitHub release
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt dist/server.crt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --prerelease="$PRERELEASE" \
              --title "Mailarky $RELEASE_TAG" --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

      - name: Update latest stable image
        if: steps.release.outputs.prerelease == 'false'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Summarize publication
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          printf 'Published %s:%s and [release downloads](https://github.com/%s/releases/tag/%s).\n\n' \
            "$IMAGE" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'For the first release, set the GHCR package visibility to public so users can pull anonymously.' >> "$GITHUB_STEP_SUMMARY"
