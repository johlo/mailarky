services:
  mailarky:
    image: mailarky:local
    build: .
    environment:
      MAILARKY_SMTP_TLS_MODE: starttls
      MAILARKY_SMTP_MAX_RECIPIENTS:
      MAILARKY_ACCOUNT_SMTP_CONNECTIONS:
      MAILARKY_ACCOUNT_IMAP_CONNECTIONS:
      MAILARKY_ACCOUNT_SMTP_COMMANDS:
      MAILARKY_ACCOUNT_SMTP_COMMAND_WINDOW:
      MAILARKY_ACCOUNT_IMAP_COMMANDS:
      MAILARKY_ACCOUNT_IMAP_COMMAND_WINDOW:
      MAILARKY_ACCOUNT_SEND_MESSAGES:
      MAILARKY_ACCOUNT_SEND_WINDOW:
      MAILARKY_ACCOUNT_QUOTA_MESSAGES:
      MAILARKY_ACCOUNT_QUOTA_BYTES:
    ports:
      - "127.0.0.1:${MAILARKY_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILARKY_IMAP_PORT:-1993}:1993"
      - "127.0.0.1:${MAILARKY_HTTP_PORT:-8026}:8026"

  webmail:
    image: mailarky-alps:local
    build:
      context: .
      dockerfile: docker/alps/Dockerfile
    profiles: [webmail]
    depends_on:
      mailarky:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAILARKY_WEBMAIL_PORT:-8027}:1323"
    environment:
      SSL_CERT_FILE: /certs/mailarky.crt
      MAILARKY_API_URL: http://mailarky:8026
    volumes:
      - ./docker/alps/config.toml:/etc/alps/config.toml:ro
      - ./testdata/tls/server.crt:/certs/mailarky.crt:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:1323/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 250ms
