  /api/v1/message/{id}/part/{part}:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageIdPartPart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: part
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
