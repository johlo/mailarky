components:
  schemas:
    Address:
      properties:
        Address:
          type: string
        Name:
          type: string
      type: object
    Attachment:
      properties:
        Checksums:
          properties:
            MD5:
              type: string
            SHA1:
              type: string
            SHA256:
              type: string
          type: object
        ContentID:
          type: string
        ContentType:
          type: string
        FileName:
          type: string
        PartID:
          type: string
        Size:
          type: integer
      type: object
    Fixture:
      additionalProperties: false
      description: At least one recipient across to/cc/bcc is required. Folder defaults to INBOX and must exist. Date defaults to now; internal_date defaults to Date. Maximum 1 MiB JSON. Duplicate Message-IDs are allowed by default.
      properties:
        bcc:
          items:
            type: string
          type: array
        body:
          type: string
        cc:
          items:
            type: string
          type: array
        date:
          format: date-time
          type:
            - string
            - "null"
        flags:
          items:
            type: string
          type: array
        folder:
          type: string
        from:
          type: string
        internal_date:
          format: date-time
          type:
            - string
            - "null"
        message_id:
          type: string
        subject:
          type: string
        to:
          items:
            type: string
          type: array
      required:
        - from
      type: object
    Folder:
      properties:
        messages:
          type: integer
        name:
          type: string
        uid_next:
          type: integer
        uid_validity:
          type: integer
      type: object
    Message:
      properties:
        Attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
        Bcc:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        Cc:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        Date:
          format: date-time
          type: string
        Folder:
          type: string
        From:
          $ref: '#/components/schemas/Address'
        HTML:
          type: string
        ID:
          type: string
        Inline:
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
        ListUnsubscribe:
          additionalProperties: true
          type: object
        MessageID:
          type: string
        Read:
          type: boolean
        ReplyTo:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        ReturnPath:
          type: string
        Size:
          type: integer
        Subject:
          type: string
        Tags:
          items:
            type: string
          type: array
        Text:
          type: string
        To:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        UID:
          type: integer
        Username:
          type: string
      type: object
    MessageList:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/MessageSummary'
          type: array
        messages_count:
          type: integer
        messages_unread:
          type: integer
        start:
          type: integer
        tags:
          items:
            type: string
          type: array
        total:
          type: integer
        unread:
          type: integer
      type: object
    MessageSummary:
      properties:
        Attachments:
          type: integer
        Bcc:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        Cc:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        Created:
          format: date-time
          type: string
        Folder:
          type: string
        From:
          $ref: '#/components/schemas/Address'
        ID:
          type: string
        MessageID:
          type: string
        Read:
          type: boolean
        ReplyTo:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        Size:
          type: integer
        Snippet:
          type: string
        Subject:
          type: string
        Tags:
          items:
            type: string
          type: array
        To:
          items:
            $ref: '#/components/schemas/Address'
          type: array
        UID:
          type: integer
        Username:
          type: string
      type: object
    Selector:
      additionalProperties: false
      anyOf:
        - required:
            - message_id
        - required:
            - from
        - required:
            - to
        - required:
            - headers
      description: All fields are conjunctive exact matches. Empty/wildcard selectors and folder-only selectors are rejected. Address/header-name comparisons ignore case. Use a unique per-test token.
      properties:
        folder:
          type: string
        from:
          type: string
        headers:
          additionalProperties:
            type: string
          minProperties: 1
          type: object
        message_id:
          type: string
        to:
          type: string
      type: object
    Send:
      additionalProperties: false
      description: At least one To/Cc/Bcc recipient required. Attachments are base64 encoded. MIME structural/address headers are managed by the API. Extra headers cannot contain newlines.
      properties:
        Attachments:
          items:
            additionalProperties: false
            properties:
              Content:
                contentEncoding: base64
                type: string
              ContentID:
                type: string
              ContentType:
                type: string
              Filename:
                type: string
            required:
              - Filename
              - Content
            type: object
          type: array
        Bcc:
          items:
            type: string
          type: array
        Cc:
          items:
            $ref: '#/components/schemas/SendAddress'
          type: array
        From:
          $ref: '#/components/schemas/SendAddress'
        HTML:
          type: string
        Headers:
          additionalProperties:
            type: string
          type: object
        ReplyTo:
          items:
            $ref: '#/components/schemas/SendAddress'
          type: array
        Subject:
          type: string
        Tags:
          items:
            type: string
          type: array
        Text:
          type: string
        To:
          items:
            $ref: '#/components/schemas/SendAddress'
          type: array
      required:
        - From
      type: object
    SendAddress:
      additionalProperties: false
      properties:
        Email:
          type: string
        Name:
          type: string
      required:
        - Email
      type: object
    Toxic:
      additionalProperties: false
      description: Toxics are ephemeral. SMTP stage defaults to data. Before DATA only envelope selectors are allowed; sender stage requires only from. IMAP types reject stage. smtp_reject requires code; imap_replace_header requires header. A hit counts an atomically selected toxic, even if an earlier terminal toxic short-circuits it. Updates preserve hits.
      properties:
        attributes:
          additionalProperties: false
          properties:
            code:
              maximum: 599
              minimum: 400
              type: integer
            delay_ms:
              maximum: 30000
              minimum: 0
              type: integer
            header:
              type: string
            stage:
              default: data
              enum:
                - sender
                - recipient
                - data
              type: string
            value:
              type: string
          type: object
        enabled:
          default: true
          type: boolean
        hits:
          minimum: 0
          readOnly: true
          type: integer
        max_hits:
          default: 0
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        probability:
          default: 1
          maximum: 1
          minimum: 0
          type: number
        selector:
          $ref: '#/components/schemas/Selector'
        type:
          enum:
            - smtp_reject
            - smtp_delay
            - imap_delay
            - imap_hide
            - imap_replace_header
          type: string
      required:
        - name
        - type
        - selector
      type: object
  securitySchemes:
    basicAuth:
      description: Optional configured HTTP credentials; the send API can use separate credentials.
      scheme: basic
      type: http
info:
  description: Independent shared SMTP, TLS IMAP and HTTP test mailbox. No browser UI or POP3. Message-scoped toxics isolate concurrent test traffic. Outbound mail is disabled unless relay/forwarding is configured. Default memory storage; optional bbolt persistence.
  title: Headless SMTP / IMAP mail emulator
  version: 2.0.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: get
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Success
      summary: Service metadata
  /api/events:
    get:
      description: 'Text JSON {Type: new|update|delete, Data: summary or {ID}}. Best effort, bounded queue; slow consumers disconnect.'
      operationId: getApiEvents
      responses:
        "101":
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Upgrade to WebSocket for mailbox events
  /api/v1/chaos:
    get:
      operationId: getApiV1Chaos
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  Enabled:
                    type: boolean
                  MessageScoped:
                    type: boolean
                  Toxics:
                    type: string
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Report global chaos disabled
    put:
      description: Use /api/v1/toxics with an exact message selector. Global chaos violates concurrency isolation.
      operationId: putApiV1Chaos
      responses:
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Reject global failure injection
  /api/v1/folders:
    get:
      operationId: getApiV1Folders
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Folder'
                type: array
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: List folders and counters
    post:
      operationId: postApiV1Folders
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                name:
                  type: string
              required:
                - name
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Create a folder
  /api/v1/info:
    get:
      operationId: getApiV1Info
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Runtime/store statistics
  /api/v1/message/{id}:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageId
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Get message detail and mark it read
  /api/v1/message/{id}/headers:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageIdHeaders
