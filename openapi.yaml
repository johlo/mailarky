          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Get decoded headers
  /api/v1/message/{id}/html-check:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageIdHtmlCheck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Analyze HTML/CSS compatibility
  /api/v1/message/{id}/link-check:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageIdLinkCheck
      parameters:
