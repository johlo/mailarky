            type: boolean
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  Errors:
                    type: integer
                  Links:
                    items:
                      properties:
                        Status:
                          type: string
                        StatusCode:
                          type: integer
                        URL:
                          type: string
                      type: object
                    type: array
