openapi: 3.1.0
info:
  title: Local IMAP test-mailbox API
  version: 1.0.0
  description: |
    Development/test-only fixture API for imap-emulator. Messages are
    kept in memory and exposed over TLS IMAP on port 1993. This API never sends
    mail. Restarting the service clears messages and changes UIDVALIDITY.
    SMTP capture is handled separately; messages are not mirrored automatically.
servers:
  - url: http://localhost:8026
    description: Default local fixture port; the E2E runner allocates a free port.
security: []
paths:
  /healthz:
    get:
      operationId: imapEmulatorHealth
      summary: Check that the fixture service is running
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
  /messages:
    post:
      operationId: seedImapMessage
      summary: Append a synthetic email to a test folder
      description: |
        Accepts at most 1 MiB of JSON. Header fields must not contain newlines.
        Message IDs may include surrounding angle brackets; the returned ID
        omits them. Reusing an ID in another folder allows deduplication tests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from]
              description: At least one recipient in to, cc or bcc is required.
              properties:
                folder:
                  type: string
                  enum: [INBOX, Sent, Archive]
                  default: INBOX
                from:
                  type: string
                  description: Sender mailbox, optionally with a display name.
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                bcc:
                  type: array
                  items:
                    type: string
                subject:
                  type: string
                  default: ''
                message_id:
                  type: string
                  description: A UUID-based Message-ID is generated when omitted or empty.
                date:
                  type: string
                  format: date-time
                  description: Original message date; defaults to now. Written to the Date header at second precision.
                internal_date:
                  type: string
                  format: date-time
                  description: IMAP received date; defaults to date.
                body:
                  type: string
                  default: ''
                  description: Kept only in the emulator; the application's importer fetches metadata only.
                flags:
                  type: array
                  items:
                    type: string
                  example: ['\Seen']
      responses:
        '201':
          description: Stored in the mailbox and available to the next IMAP poll
          content:
            application/json:
              schema:
                type: object
                required: [folder, message_id]
                properties:
                  folder:
                    type: string
                  message_id:
                    type: string
        '400':
          description: Invalid JSON, folder, address, date or header
        '500':
          description: Message could not be appended
