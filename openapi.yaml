              schema:
                $ref: '#/components/schemas/MessageList'
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: List or search messages newest first
    put:
      description: IDs or Search; neither means all messages. Do not use global updates in concurrent tests.
      operationId: putApiV1Messages
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                IDs:
                  items:
                    type: string
                  type: array
                Read:
                  type: boolean
                Search:
                  type: string
              required:
                - Read
              type: object
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Set read state
  /api/v1/messages/raw:
    post:
      operationId: postApiV1MessagesRaw
      parameters:
        - description: ""
          in: query
          name: folder
          schema:
            default: INBOX
            type: string
      requestBody:
        content:
          message/rfc822:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  Folder:
                    type: string
                  ID:
                    type: string
                  MessageID:
                    type: string
                type: object
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Resource not found
      summary: Import original MIME
  /api/v1/search:
    delete:
      operationId: deleteApiV1Search
      parameters:
        - description: ""
          in: query
          name: query
          schema:
            type: string
        - description: ""
          in: query
          name: tz
          schema:
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Success
        "400":
          content:
