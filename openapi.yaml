  /api/v1/message/{id}/raw:
    get:
      description: id is a database UUID or latest. Inspection endpoints other than detail do not mark read.
      operationId: getApiV1MessageIdRaw
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: binary
                type: string
