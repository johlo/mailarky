        - description: ""
          in: query
          name: start
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: ""
          in: query
          name: limit
          schema:
            default: 50
            maximum: 10000
            minimum: 1
            type: integer
        - description: AND terms, quoted phrases, !/- negation; from/to/cc/bcc/reply-to/addressed/subject/message-id/tag/username/folder/body, is:read/unread/tagged, has:attachment/inline, larger/smaller, before/after
