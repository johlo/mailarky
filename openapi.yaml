components:
    schemas:
        Account:
            additionalProperties: false
            properties:
                limits:
                    $ref: '#/components/schemas/AccountLimits'
                api_base:
                    type: string
                created:
                    format: date-time
                    type: string
                id:
                    type: string
                name:
                    type: string
                recipients:
                    items:
                        type: string
                    type: array
                username:
                    type: string
            required:
                - id
                - name
                - username
                - recipients
                - created
                - api_base
                - limits
            type: object
        AccountLimits:
            type: object
            additionalProperties: false
            description: Nonnegative per-account limits; zero is unlimited. When present on account creation this object replaces all server defaults. Persisted and immutable for the lifetime of that account.
            properties:
                smtp_connections:
                    type: integer
                    minimum: 0
                    default: 0
                imap_connections:
                    type: integer
                    minimum: 0
                    default: 0
                send_messages:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Authenticated SMTP submissions per send_window. Anonymous SMTP is not rate-limited.
                send_window:
                    type: string
                    description: Positive Go duration, e.g. 1m; required if send_messages is nonzero.
                quota_messages:
                    type: integer
                    minimum: 0
                    default: 0
                quota_bytes:
                    type: integer
                    format: int64
                    minimum: 0
                    default: 0
        OAuthToken:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    pattern: '^[!-~]+$'
                    writeOnly: true
                status:
                    type: string
                    enum: [valid, expired, rejected]
                    default: valid
                expires_at:
                    type: string
                    format: date-time
        FaultSequence:
            type: object
            additionalProperties: false
            required: [steps]
            description: Cannot be combined with probability. One step per matching event; pass skips this rule and apply claims its action. A finished non-repeating sequence passes all later matches. PUT and PATCH preserve position.
            properties:
                steps:
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                        type: string
                        enum: [pass, apply]
                repeat:
                    type: boolean
                    default: false
        Drop:
            type: object
            additionalProperties: false
            required: [type]
            description: Drop an IDLE wire notification. Server view advances; SELECT resynchronizes a stale client. Only valid in IMAP IDLE notification phase.
            properties:
                type:
                    type: string
                    enum: [drop]
        Action:
            oneOf:
                - $ref: '#/components/schemas/SMTPReject'
                - $ref: '#/components/schemas/IMAPReject'
                - $ref: '#/components/schemas/Delay'
                - $ref: '#/components/schemas/Disconnect'
                - $ref: '#/components/schemas/Drop'
                - $ref: '#/components/schemas/Response'
                - $ref: '#/components/schemas/Capabilities'
                - $ref: '#/components/schemas/ResetUIDValidity'
                - $ref: '#/components/schemas/Hide'
                - $ref: '#/components/schemas/ReplaceHeader'
                - $ref: '#/components/schemas/ReplaceBody'
        Address:
            additionalProperties: false
            properties:
                address:
                    type: string
                name:
                    type: string
            required:
                - name
                - address
            type: object
        Attachment:
            additionalProperties: false
            properties:
                content_id:
                    type: string
                content_type:
                    type: string
                filename:
                    type: string
                part_id:
                    type: string
                size:
                    minimum: 0
                    type: integer
            required:
                - part_id
                - filename
                - content_type
                - size
            type: object
        Capabilities:
            additionalProperties: false
            properties:
                omit:
                    items:
                        type: string
                    minItems: 1
                    type: array
                type:
                    enum:
                        - capabilities
                    type: string
            required:
                - type
                - omit
            type: object
        CreateAccount:
            additionalProperties: false
            properties:
                limits:
                    $ref: '#/components/schemas/AccountLimits'
                oauth_tokens:
                    type: array
                    maxItems: 100
                    items:
                        $ref: '#/components/schemas/OAuthToken'
                name:
                    maxLength: 100
                    type: string
                password:
                    maxLength: 72
                    type: string
                recipients:
                    items:
                        type: string
                    type: array
                username:
                    maxLength: 255
                    type: string
            type: object
        CreateFault:
            additionalProperties: false
            properties:
                action:
                    $ref: '#/components/schemas/Action'
                enabled:
                    default: true
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                filter:
                    $ref: '#/components/schemas/Filter'
                hits:
                    minimum: 0
                    readOnly: true
                    type: integer
                matches:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: Matching events before sequence/probability selection; disabled, expired and max-hit-exhausted rules do not advance.
                sequence:
                    $ref: '#/components/schemas/FaultSequence'
                max_hits:
                    minimum: 0
                    type: integer
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                probability:
                    default: 1
                    maximum: 1
                    minimum: 0
                    type: number
                trigger:
                    $ref: '#/components/schemas/Trigger'
            required:
                - name
                - trigger
                - action
            type: object
        CreatedAccount:
            additionalProperties: false
            properties:
                limits:
                    $ref: '#/components/schemas/AccountLimits'
                api_base:
                    type: string
                created:
                    format: date-time
                    type: string
                id:
                    type: string
                name:
                    type: string
                password:
                    type: string
                recipients:
                    items:
                        type: string
                    type: array
                username:
                    type: string
            required:
                - id
                - name
                - username
                - recipients
                - created
                - api_base
                - limits
                - password
            type: object
        Delay:
            additionalProperties: false
            properties:
                delay_ms:
                    maximum: 30000
                    minimum: 0
                    type: integer
                type:
                    enum:
                        - delay
                    type: string
            required:
                - type
                - delay_ms
            type: object
        DeleteMessages:
            additionalProperties: false
            properties:
                ids:
                    items:
                        type: string
                    type: array
            type: object
        Disconnect:
            additionalProperties: false
            properties:
                after_ms:
                    type: integer
                    minimum: 0
                    maximum: 86400000
                    description: IMAP IDLE active phase only; milliseconds after IDLE starts. Omitted means immediate.
                message:
                    maxLength: 1000
                    type: string
                silent:
                    default: false
                    type: boolean
                type:
                    enum:
                        - disconnect
                    type: string
            required:
                - type
            type: object
        Error:
            additionalProperties: false
            properties:
                error:
                    type: string
            required:
                - error
            type: object
        Event:
            additionalProperties: false
            properties:
                data:
                    additionalProperties: true
                    type: object
                type:
                    enum:
                        - new
                        - update
                        - delete
                    type: string
            required:
                - type
                - data
            type: object
        Fault:
            additionalProperties: false
            properties:
                action:
                    $ref: '#/components/schemas/Action'
                enabled:
                    default: true
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                filter:
                    $ref: '#/components/schemas/Filter'
                hits:
                    minimum: 0
                    readOnly: true
                    type: integer
                matches:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: Matching events before sequence/probability selection; disabled, expired and max-hit-exhausted rules do not advance.
                sequence:
                    $ref: '#/components/schemas/FaultSequence'
                max_hits:
                    minimum: 0
                    type: integer
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                probability:
                    default: 1
                    maximum: 1
                    minimum: 0
                    type: number
                trigger:
                    $ref: '#/components/schemas/Trigger'
            required:
                - name
                - enabled
                - trigger
                - filter
                - action
                - hits
                - matches
            type: object
        Filter:
            additionalProperties: false
            properties:
                notification:
                    type: string
                    enum: [EXISTS, EXPUNGE, FLAGS]
                    description: Only for IMAP IDLE notification phase.
                folder:
                    description: Exact IMAP folder.
                    type: string
                message:
                    $ref: '#/components/schemas/MessageSelector'
                username:
                    description: Server registry only.
                    type: string
            type: object
        Fixture:
            additionalProperties: false
            properties:
                bcc:
                    items:
                        type: string
                    type: array
                body:
                    type: string
                cc:
                    items:
                        type: string
                    type: array
                date:
                    format: date-time
                    type: string
                flags:
                    items:
                        type: string
                    type: array
                folder:
                    default: INBOX
                    type: string
                from:
                    type: string
                internal_date:
                    format: date-time
                    type: string
                message_id:
                    type: string
                subject:
                    type: string
                to:
                    items:
                        type: string
                    type: array
            required:
                - from
                - to
            type: object
        Flags:
            additionalProperties: false
            properties:
                flags:
                    items:
                        type: string
                    type: array
            required:
                - flags
            type: object
        Folder:
            additionalProperties: false
            properties:
                messages:
                    minimum: 0
                    type: integer
                name:
                    type: string
                uid_next:
                    minimum: 0
                    type: integer
                uid_validity:
                    minimum: 0
                    type: integer
            required:
                - name
                - messages
                - uid_next
                - uid_validity
            type: object
        FolderName:
            additionalProperties: false
            properties:
                name:
                    type: string
            required:
                - name
            type: object
        Hide:
            additionalProperties: false
            properties:
                type:
                    enum:
                        - hide
                    type: string
            required:
                - type
            type: object
        IMAPReject:
            additionalProperties: false
            properties:
                message:
                    maxLength: 1000
                    type: string
                response_code:
                    pattern: ^[A-Z][A-Z0-9-]*$
                    type: string
                status:
                    enum:
                        - "NO"
                        - BAD
                    type: string
                type:
                    enum:
                        - reject
                    type: string
            required:
                - type
                - status
            type: object
        Message:
            additionalProperties: false
            properties:
                account_id:
                    type: string
                attachments:
                    items:
                        $ref: '#/components/schemas/Attachment'
                    type: array
                bcc:
                    items:
                        $ref: '#/components/schemas/Address'
                    type: array
                cc:
                    items:
                        $ref: '#/components/schemas/Address'
                    type: array
                date:
                    format: date-time
                    type: string
                flags:
                    items:
                        type: string
                    type: array
                folder:
                    type: string
                from:
                    $ref: '#/components/schemas/Address'
                html:
                    type: string
                id:
                    type: string
                inline:
                    items:
                        $ref: '#/components/schemas/Attachment'
                    type: array
                message_id:
                    type: string
                read:
                    type: boolean
                reply_to:
                    items:
                        $ref: '#/components/schemas/Address'
                    type: array
                return_path:
                    type: string
                size:
                    minimum: 0
                    type: integer
                subject:
                    type: string
                text:
                    type: string
                to:
                    items:
                        $ref: '#/components/schemas/Address'
                    type: array
                uid:
                    minimum: 0
                    type: integer
                username:
                    type: string
            required:
                - account_id
                - id
                - message_id
                - from
                - to
                - cc
                - bcc
                - reply_to
                - subject
                - text
                - html
                - date
                - size
                - inline
                - attachments
                - return_path
                - username
                - folder
                - uid
                - read
                - flags
            type: object
        MessageList:
            additionalProperties: false
            properties:
                matched:
                    minimum: 0
                    type: integer
                matched_unread:
                    minimum: 0
                    type: integer
                messages:
                    items:
                        $ref: '#/components/schemas/MessageSummary'
                    type: array
                start:
                    minimum: 0
                    type: integer
                total:
                    minimum: 0
                    type: integer
                unread:
                    minimum: 0
                    type: integer
            required:
                - messages
                - start
                - total
                - unread
                - matched
                - matched_unread
            type: object
        MessageSelector:
            additionalProperties: false
            minProperties: 1
            properties:
                from:
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    type: object
                message_id:
                    type: string
                to:
                    type: string
            type: object
        MessageSummary:
            additionalProperties: false
            properties:
                account_id:
                    type: string
                attachments:
                    minimum: 0
                    type: integer
                created:
                    format: date-time
                    type: string
                folder:
                    type: string
                from:
                    $ref: '#/components/schemas/Address'
                id:
                    type: string
                message_id:
                    type: string
                read:
                    type: boolean
                size:
                    minimum: 0
                    type: integer
                snippet:
                    type: string
                subject:
                    type: string
                to:
                    items:
                        $ref: '#/components/schemas/Address'
                    type: array
                uid:
                    minimum: 0
                    type: integer
                username:
                    type: string
            required:
                - account_id
                - id
                - message_id
                - from
                - to
                - subject
                - size
                - username
                - folder
                - uid
                - read
                - snippet
                - created
                - attachments
            type: object
        ReplaceBody:
            additionalProperties: false
            properties:
                type:
                    enum:
                        - replace_body
                    type: string
                value:
                    type: string
            required:
                - type
                - value
            type: object
        ReplaceFault:
            additionalProperties: false
            properties:
                action:
                    $ref: '#/components/schemas/Action'
                enabled:
                    default: true
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                filter:
                    $ref: '#/components/schemas/Filter'
                hits:
                    minimum: 0
                    readOnly: true
                    type: integer
                matches:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: Matching events before sequence/probability selection; disabled, expired and max-hit-exhausted rules do not advance.
                sequence:
                    $ref: '#/components/schemas/FaultSequence'
                max_hits:
                    minimum: 0
                    type: integer
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                probability:
                    default: 1
                    maximum: 1
                    minimum: 0
                    type: number
                trigger:
                    $ref: '#/components/schemas/Trigger'
            required:
                - trigger
                - action
            type: object
        ReplaceHeader:
            additionalProperties: false
            properties:
                header:
                    type: string
                type:
                    enum:
                        - replace_header
                    type: string
                value:
                    type: string
            required:
                - type
                - header
                - value
            type: object
        ResetUIDValidity:
            additionalProperties: false
            properties:
                type:
                    enum:
                        - reset_uidvalidity
                    type: string
            required:
                - type
            type: object
        Response:
            additionalProperties: false
            properties:
                close:
                    default: false
                    type: boolean
                response:
                    maxLength: 8192
                    minLength: 1
                    type: string
                type:
                    enum:
                        - response
                    type: string
            required:
                - type
                - response
            type: object
        SMTPReject:
            additionalProperties: false
            properties:
                code:
                    maximum: 599
                    minimum: 400
                    type: integer
                enhanced_code:
                    pattern: ^[45]\.[0-9]{1,3}\.[0-9]{1,3}$
                    type: string
                message:
                    maxLength: 1000
                    type: string
                type:
                    enum:
                        - reject
                    type: string
            required:
                - type
                - code
            type: object
        ToggleFault:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        Trigger:
            additionalProperties: false
            properties:
                command:
                    description: Uppercase SMTP/IMAP command, including CONNECT and distinct UID commands.
                    type: string
                phase:
                    enum:
                        - before
                        - content
                        - after
                        - active
                        - notification
                    type: string
                protocol:
                    enum:
                        - smtp
                        - imap
                    type: string
            required:
                - protocol
                - command
                - phase
            type: object
    securitySchemes:
        basicAuth:
            scheme: basic
            type: http
info:
    description: Isolated SMTP/IMAP test accounts, observational message inspection and programmable protocol faults. Server faults have their own registry. HTTP Basic authentication is optional and controls all accounts.
    title: Mailarky control API
    version: 0.1.0
openapi: 3.0.3
paths:
    /:
        get:
            operationId: get_
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    api:
                                        type: string
                                    protocols:
                                        items:
                                            type: string
                                        type: array
                                    service:
                                        type: string
                                required:
                                    - service
                                    - api
                                    - protocols
                                type: object
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: Read service entry point
    /api/v1/accounts:
        get:
            operationId: get_api_v1_accounts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Account'
                                type: array
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: List accounts
        post:
            operationId: post_api_v1_accounts
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAccount'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreatedAccount'
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: Create isolated SMTP and IMAP account
    /api/v1/accounts/{account}:
        delete:
            operationId: delete_api_v1_accounts_account
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: Remove an account
        get:
            operationId: get_api_v1_accounts_account
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Account'
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: Describe an account
    /api/v1/accounts/{account}/oauth-tokens:
        put:
            operationId: put_api_v1_accounts_account_oauth_tokens
            summary: Replace or revoke the account's test OAuth tokens
            description: Applies to future XOAUTH2 authentication on SMTP and IMAP. Existing authenticated sessions remain connected. Tokens persist as hashes; values are never returned. Send an empty tokens array to revoke all.
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [tokens]
                            properties:
                                tokens:
                                    type: array
                                    maxItems: 100
                                    items:
                                        $ref: '#/components/schemas/OAuthToken'
            responses:
                "204":
                    description: Tokens replaced
                "400":
                    description: Invalid tokens
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: HTTP authentication required
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: Account not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Storage or service failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/accounts/{account}/events:
        get:
            description: WebSocket messages follow the Event schema. A bounded subscriber queue disconnects slow consumers.
            operationId: get_api_v1_accounts_account_events
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            responses:
                "101":
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: HTTP authentication required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Storage or service failure
            summary: Upgrade to account event WebSocket
    /api/v1/accounts/{account}/faults:
        get:
            operationId: get_api_v1_accounts_account_faults
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Fault'
                                type: array
                    description: Successful operation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input
