      description: Omitted/empty IDs deletes all messages. Concurrent tests must delete only their owned IDs.
      operationId: deleteApiV1Messages
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                IDs:
                  items:
                    type: string
                  type: array
              type: object
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
              schema:
                type: string
