  /api/v1/message/{id}/release:
    post:
      description: Explicit recipients required. Restrictions apply; Message-ID is replaced unless preserve-message-ids is enabled. Stored original is unchanged.
      operationId: postApiV1MessageIdRelease
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                To:
                  items:
                    type: string
                  type: array
              required:
                - To
              type: object
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Success
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Configured authentication required
        "404":
          content:
            text/plain:
