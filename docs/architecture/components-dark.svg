  <text x="741.5" y="263.4" fill="#8b8b8b" text-anchor="middle">[Component: net/http]</text>
  <text x="741.5" y="282.4" fill="#d9d9d9" text-anchor="middle">Fixtures, search,</text>
  <text x="741.5" y="301.4" fill="#d9d9d9" text-anchor="middle">inspection, faults and</text>
  <text x="741.5" y="320.4" fill="#d9d9d9" text-anchor="middle">account management</text>
  <path d="M197.5 449 H713.5 a8 8 0 0 1 8 8 V545 a8 8 0 0 1 -8 8 H197.5 a8 8 0 0 1 -8 -8 V457 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="455.5" y="477.4" fill="#d9d9d9" text-anchor="middle">Service</text>
  <text x="455.5" y="496.4" fill="#8b8b8b" text-anchor="middle">[Component]</text>
  <text x="455.5" y="515.4" fill="#d9d9d9" text-anchor="middle">Config, server faults and account catalog. Routes SMTP AUTH,</text>
  <text x="455.5" y="534.4" fill="#d9d9d9" text-anchor="middle">anonymous recipients and IMAP logins</text>
