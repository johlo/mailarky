  <text x="455.5" y="244.4" fill="#d9d9d9" text-anchor="middle">IMAP server</text>
  <text x="455.5" y="263.4" fill="#8b8b8b" text-anchor="middle">[Component: go-imap v2]</text>
  <text x="455.5" y="282.4" fill="#d9d9d9" text-anchor="middle">Serves folders over TLS</text>
  <text x="455.5" y="301.4" fill="#d9d9d9" text-anchor="middle">IMAP4rev1 and applies IMAP</text>
  <text x="455.5" y="320.4" fill="#d9d9d9" text-anchor="middle">faults</text>
  <path d="M62 225.5 H268 a8 8 0 0 1 8 8 V321.5 a8 8 0 0 1 -8 8 H62 a8 8 0 0 1 -8 -8 V233.5 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="165" y="253.9" fill="#d9d9d9" text-anchor="middle">SMTP server</text>
  <text x="165" y="272.9" fill="#8b8b8b" text-anchor="middle">[Component: go-smtp]</text>
  <text x="165" y="291.9" fill="#d9d9d9" text-anchor="middle">Captures deliveries and</text>
  <text x="165" y="310.9" fill="#d9d9d9" text-anchor="middle">applies SMTP faults</text>
