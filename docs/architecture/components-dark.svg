  <text x="342.5" y="840.4" fill="#d9d9d9" text-anchor="middle">Raw MIME, folders, UIDs,</text>
  <text x="342.5" y="859.4" fill="#d9d9d9" text-anchor="middle">flags. One append path for</text>
  <text x="342.5" y="878.4" fill="#d9d9d9" text-anchor="middle">every protocol</text>
  <path d="M530 774 H752 a8 8 0 0 1 8 8 V889 a8 8 0 0 1 -8 8 H530 a8 8 0 0 1 -8 -8 V782 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
  <text x="641" y="802.4" fill="#d9d9d9" text-anchor="middle">Account fault registry</text>
