  <text x="678" y="268.4" fill="#1f2328" text-anchor="middle">Mailarky</text>
  <text x="678" y="287.4" fill="#6e7781" text-anchor="middle">[Software system]</text>
  <text x="678" y="306.4" fill="#1f2328" text-anchor="middle">Captures SMTP mail, serves it</text>
  <text x="678" y="325.4" fill="#1f2328" text-anchor="middle">over TLS IMAP and exposes it</text>
  <text x="678" y="344.4" fill="#1f2328" text-anchor="middle">through an HTTP API</text>
  <path d="M48 249.5 H270 a8 8 0 0 1 8 8 V345.5 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V257.5 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="159" y="277.9" fill="#1f2328" text-anchor="middle">Application under test</text>
  <text x="159" y="296.9" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="159" y="315.9" fill="#1f2328" text-anchor="middle">Sends and reads mail with</text>
  <text x="159" y="334.9" fill="#1f2328" text-anchor="middle">a test account</text>
  <path d="M311.5 40 H542.5 a8 8 0 0 1 8 8 V136 a8 8 0 0 1 -8 8 H311.5 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#ecd0ce" stroke="#b3423a"/>
  <text x="427" y="68.4" fill="#1f2328" text-anchor="middle">Test suite</text>
  <text x="427" y="87.4" fill="#6e7781" text-anchor="middle">[Person or CI job]</text>
  <text x="427" y="106.4" fill="#1f2328" text-anchor="middle">Drives the application and</text>
  <text x="427" y="125.4" fill="#1f2328" text-anchor="middle">asserts on its mail</text>
  <path d="M1086 235.5 H1336 a8 8 0 0 1 8 8 V359.5 a8 8 0 0 1 -8 8 H1086 a8 8 0 0 1 -8 -8 V243.5 a8 8 0 0 1 8 -8 Z" fill="none" stroke="none"/>

