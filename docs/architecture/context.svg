  <path d="M481.4 254 H737.4 a8 8 0 0 1 8 8 V369 a8 8 0 0 1 -8 8 H481.4 a8 8 0 0 1 -8 -8 V262 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="609.4" y="282.4" fill="#1f2328" text-anchor="middle">Mailarky</text>
  <text x="609.4" y="301.4" fill="#6e7781" text-anchor="middle">[Software system]</text>
  <text x="609.4" y="320.4" fill="#1f2328" text-anchor="middle">Captures SMTP mail, serves it</text>
  <text x="609.4" y="339.4" fill="#1f2328" text-anchor="middle">over TLS IMAP and exposes it</text>
  <text x="609.4" y="358.4" fill="#1f2328" text-anchor="middle">through an HTTP API</text>
  <path d="M48 263.5 H270 a8 8 0 0 1 8 8 V359.5 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V271.5 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="159" y="291.9" fill="#1f2328" text-anchor="middle">Application under test</text>
  <text x="159" y="310.9" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="159" y="329.9" fill="#1f2328" text-anchor="middle">Sends and reads mail with</text>
  <text x="159" y="348.9" fill="#1f2328" text-anchor="middle">a test account</text>
  <path d="M277.2 40 H508.2 a8 8 0 0 1 8 8 V136 a8 8 0 0 1 -8 8 H277.2 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#ecd0ce" stroke="#b3423a"/>
  <text x="392.7" y="68.4" fill="#1f2328" text-anchor="middle">Test suite</text>
  <text x="392.7" y="87.4" fill="#6e7781" text-anchor="middle">[Person or CI job]</text>
  <text x="392.7" y="106.4" fill="#1f2328" text-anchor="middle">Drives the application and</text>
  <text x="392.7" y="125.4" fill="#1f2328" text-anchor="middle">asserts on its mail</text>
  <path d="M963.8 249.5 H1213.8 a8 8 0 0 1 8 8 V373.5 a8 8 0 0 1 -8 8 H963.8 a8 8 0 0 1 -8 -8 V257.5 a8 8 0 0 1 8 -8 Z" fill="none" stroke="none"/>

  <path d="M977.8 263.5 H1199.8 a8 8 0 0 1 8 8 V359.5 a8 8 0 0 1 -8 8 H977.8 a8 8 0 0 1 -8 -8 V271.5 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="1088.8" y="291.9" fill="#1f2328" text-anchor="middle">Webhook receiver</text>
