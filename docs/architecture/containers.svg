  <text x="602.5" y="268.4" fill="#1f2328" text-anchor="start">Mailarky <tspan fill="#6e7781">[Software system]</tspan></text>
  <path d="M730 283 H1028 a8 8 0 0 1 8 8 V417 a8 8 0 0 1 -8 8 H730 a8 8 0 0 1 -8 -8 V291 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="879" y="311.4" fill="#1f2328" text-anchor="middle">Mailarky service</text>
  <text x="879" y="330.4" fill="#6e7781" text-anchor="middle">[Container: Go, Docker image]</text>
  <text x="879" y="349.4" fill="#1f2328" text-anchor="middle">Accepts SMTP on 1025, serves TLS</text>
  <text x="879" y="368.4" fill="#1f2328" text-anchor="middle">IMAP on 1993 and the HTTP API on</text>
  <text x="879" y="387.4" fill="#1f2328" text-anchor="middle">8026. Holds each account's mail in</text>
  <text x="879" y="406.4" fill="#1f2328" text-anchor="middle">memory</text>
  <path d="M730 521 H1028 a8 8 0 0 1 8 8 V636 a8 8 0 0 1 -8 8 H730 a8 8 0 0 1 -8 -8 V529 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="854" y="549.4" fill="#1f2328" text-anchor="middle">Message database</text>
  <text x="854" y="568.4" fill="#6e7781" text-anchor="middle">[Container: bbolt files]</text>
  <text x="854" y="587.4" fill="#1f2328" text-anchor="middle">Optional. Persists accounts,</text>
  <text x="854" y="606.4" fill="#1f2328" text-anchor="middle">messages, flags and UIDs</text>
  <text x="854" y="625.4" fill="#1f2328" text-anchor="middle">across restarts</text>
