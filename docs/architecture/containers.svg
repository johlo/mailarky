  <text x="507" y="558.9" fill="#1f2328" text-anchor="middle">sendmail client</text>
  <text x="507" y="577.9" fill="#6e7781" text-anchor="middle">[Container: same binary]</text>
  <text x="507" y="596.9" fill="#1f2328" text-anchor="middle">Submits .eml files to the</text>
  <text x="507" y="615.9" fill="#1f2328" text-anchor="middle">SMTP listener</text>
  <path d="M48 283 H270 a8 8 0 0 1 8 8 V379 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V291 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="159" y="311.4" fill="#1f2328" text-anchor="middle">Application under test</text>
  <text x="159" y="330.4" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="159" y="349.4" fill="#1f2328" text-anchor="middle">Sends and reads mail with</text>
  <text x="159" y="368.4" fill="#1f2328" text-anchor="middle">a test account</text>
  <path d="M429.5 40 H660.5 a8 8 0 0 1 8 8 V136 a8 8 0 0 1 -8 8 H429.5 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#ecd0ce" stroke="#b3423a"/>
  <text x="545" y="68.4" fill="#1f2328" text-anchor="middle">Test suite</text>
