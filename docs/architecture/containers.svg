<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="726" viewBox="0 0 1580 726" font-family="'DejaVu Sans Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace" font-size="14px">
