  <g font-size="12px">
  <text x="513.5" y="362.7" fill="#6e7781" text-anchor="middle">Reads the mailbox</text>
  <text x="513.5" y="378.7" fill="#6e7781" text-anchor="middle">[IMAP over TLS]</text>
  </g>
