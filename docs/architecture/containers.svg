  <text x="1495" y="330.4" fill="#1f2328" text-anchor="middle">Webhook receiver</text>
  <text x="1495" y="349.4" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="1495" y="368.4" fill="#1f2328" text-anchor="middle">Optional. Notified of new</text>
