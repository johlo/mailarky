  <rect x="0" y="0" width="1580" height="726" fill="#ffffff"/>
  <path d="M396 254 H1069 a8 8 0 0 1 8 8 V678 a8 8 0 0 1 -8 8 H396 a8 8 0 0 1 -8 -8 V262 a8 8 0 0 1 8 -8 Z" fill="none" stroke="#3a7d44"/>
  <text x="402" y="282.4" fill="#1f2328" text-anchor="start">Mail Sandbox <tspan fill="#6e7781">[Software system]</tspan></text>
  <path d="M757 297 H1055 a8 8 0 0 1 8 8 V431 a8 8 0 0 1 -8 8 H757 a8 8 0 0 1 -8 -8 V305 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="906" y="325.4" fill="#1f2328" text-anchor="middle">Mail Sandbox service</text>
  <text x="906" y="344.4" fill="#6e7781" text-anchor="middle">[Container: Go, Docker image]</text>
  <text x="906" y="363.4" fill="#1f2328" text-anchor="middle">Accepts SMTP on 1025, serves TLS</text>
  <text x="906" y="382.4" fill="#1f2328" text-anchor="middle">IMAP on 1993 and the HTTP API on</text>
  <text x="906" y="401.4" fill="#1f2328" text-anchor="middle">8026. Holds each account's mail in</text>
  <text x="906" y="420.4" fill="#1f2328" text-anchor="middle">memory</text>
  <path d="M758 549 H1054 a8 8 0 0 1 8 8 V664 a8 8 0 0 1 -8 8 H758 a8 8 0 0 1 -8 -8 V557 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="882" y="577.4" fill="#1f2328" text-anchor="middle">Message database</text>
  <text x="882" y="596.4" fill="#6e7781" text-anchor="middle">[Container: bbolt files]</text>
  <text x="882" y="615.4" fill="#1f2328" text-anchor="middle">Optional. Persists accounts,</text>
  <text x="882" y="634.4" fill="#1f2328" text-anchor="middle">messages, flags and UIDs</text>
  <text x="882" y="653.4" fill="#1f2328" text-anchor="middle">across restarts</text>
  <g transform="translate(1010 591.5) scale(1.58333)">
    <path d="M3 6.4 v11.2 a9 3.4 0 0 0 18 0 v-11.2 Z" fill="#d6d9e6" stroke="#57606a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M3 6.4 a9 3.4 0 0 1 18 0 a9 3.4 0 0 1 -18 0 Z" fill="#d6d9e6" stroke="#57606a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M3 11 a9 3.4 0 0 0 18 0" fill="none" stroke="#57606a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M3 15.6 a9 3.4 0 0 0 18 0" fill="none" stroke="#57606a" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
  <path d="M410 558.5 H632 a8 8 0 0 1 8 8 V654.5 a8 8 0 0 1 -8 8 H410 a8 8 0 0 1 -8 -8 V566.5 a8 8 0 0 1 8 -8 Z" fill="#cedfd0" stroke="#3a7d44"/>
  <text x="521" y="586.9" fill="#1f2328" text-anchor="middle">sendmail client</text>
  <text x="521" y="605.9" fill="#6e7781" text-anchor="middle">[Container: same binary]</text>
  <text x="521" y="624.9" fill="#1f2328" text-anchor="middle">Submits .eml files to the</text>
  <text x="521" y="643.9" fill="#1f2328" text-anchor="middle">SMTP listener</text>
  <path d="M48 297 H270 a8 8 0 0 1 8 8 V393 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V305 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="159" y="325.4" fill="#1f2328" text-anchor="middle">Application under test</text>
  <text x="159" y="344.4" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="159" y="363.4" fill="#1f2328" text-anchor="middle">Sends email and imports a</text>
  <text x="159" y="382.4" fill="#1f2328" text-anchor="middle">mailbox</text>
  <path d="M443 40 H674 a8 8 0 0 1 8 8 V136 a8 8 0 0 1 -8 8 H443 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#ecd0ce" stroke="#b3423a"/>
  <text x="558.5" y="68.4" fill="#1f2328" text-anchor="middle">Test suite</text>
  <text x="558.5" y="87.4" fill="#6e7781" text-anchor="middle">[Person or CI job]</text>
  <text x="558.5" y="106.4" fill="#1f2328" text-anchor="middle">Drives the application and</text>
  <text x="558.5" y="125.4" fill="#1f2328" text-anchor="middle">asserts on its mail</text>
  <path d="M1281.4 245 H1531.4 a8 8 0 0 1 8 8 V483 a8 8 0 0 1 -8 8 H1281.4 a8 8 0 0 1 -8 -8 V253 a8 8 0 0 1 8 -8 Z" fill="none" stroke="none"/>

  <path d="M1295.4 259 H1517.4 a8 8 0 0 1 8 8 V355 a8 8 0 0 1 -8 8 H1295.4 a8 8 0 0 1 -8 -8 V267 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="1406.4" y="287.4" fill="#1f2328" text-anchor="middle">Webhook receiver</text>
  <text x="1406.4" y="306.4" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="1406.4" y="325.4" fill="#1f2328" text-anchor="middle">Optional. Notified of new</text>
  <text x="1406.4" y="344.4" fill="#1f2328" text-anchor="middle">messages</text>
  <path d="M1295.4 373 H1517.4 a8 8 0 0 1 8 8 V469 a8 8 0 0 1 -8 8 H1295.4 a8 8 0 0 1 -8 -8 V381 a8 8 0 0 1 8 -8 Z" fill="#eef0f7" stroke="#8a90a8"/>
  <text x="1406.4" y="401.4" fill="#1f2328" text-anchor="middle">SpamAssassin</text>
  <text x="1406.4" y="420.4" fill="#6e7781" text-anchor="middle">[External system]</text>
  <text x="1406.4" y="439.4" fill="#1f2328" text-anchor="middle">Optional. Scores messages</text>
  <text x="1406.4" y="458.4" fill="#1f2328" text-anchor="middle">for spam checks</text>
