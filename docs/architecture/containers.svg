  <rect x="590.75" y="204.5" width="291" height="32" fill="#ffffff"/>
  <g font-size="12px">
  <text x="736.25" y="216.7" fill="#6e7781" text-anchor="middle">Seeds mail, inspects it, injects faults</text>
  <text x="736.25" y="232.7" fill="#6e7781" text-anchor="middle">[HTTP]</text>
  </g>
