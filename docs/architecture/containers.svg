  <g font-size="12px">
  <text x="593.35" y="433.8" fill="#6e7781" text-anchor="middle">Submits mail</text>
  <text x="593.35" y="449.8" fill="#6e7781" text-anchor="middle">[SMTP]</text>
  </g>
